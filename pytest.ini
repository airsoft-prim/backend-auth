[pytest]
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

testpaths = tests
python_files = test_*.py

console_output_style = progress
asyncio_mode = auto
addopts = --disable-warnings

norecursedirs =
    .venv
    build
    dist
    __pycache__