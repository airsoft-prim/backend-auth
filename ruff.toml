line-length = 100
target-version = "py314"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "site-packages",
    "venv",
    "report",
]

extend-select = [
    "C90",    # mccabe
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "S",      # bandit
    "BLE",    # flake8-blind-except
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # datetimez
    "EM",     # error-messages
    "FA",     # future-annotations
    "ISC",    # implicit string concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-argument
    "ERA",    # eradicate commented out code
    "A",      # flake8-builtins
    "F",      # pyflakes
    "Q",      # flake8-quotes
    "ASYNC",  # flake8-async
    "E",      # pycodestyle
    "W",      # pycodestyle
    "T20",    # flake8-print
    "ANN",    # flake8-annotations
    "PL",     # pylint
    "RET",    # flake8-return
    "RUF",    # ruff-specific rules
    "PYI",    # flake8-pyi
    "PD",     # pandas-vet
]

ignore = [
    "ANN101",
    "ANN102",
    "ANN401",
    "RUF001",
    "RUF002",
]

[lint.mccabe]
max-complexity = 10

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
exclude = ["*.pyi"]