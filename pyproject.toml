[project]
name = "backend-auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruslan Bashinskiy", email = "main+development@oidaho.ru"}
]
maintainers = []
classifiers = [
    "License :: GPLv3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "croniter>=6.2.4",
    "pwdlib[argon2]>=0.3.1",
]

[dependency-groups]
migrations = [
    "alembic>=1.20.0",
]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "pre-commit>=4.7.0",
    "ruff>=0.16.8",
    "rust-just>=1.59.0",
    "ty>=0.0.83",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]


[tool.uv]
package = false
default-groups = "all"
